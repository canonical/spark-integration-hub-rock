name: spark-integration-hub
summary: Charmed Spark Integration Hub
description: |
  This is an OCI image that bundles the routines that are needed by the Spark Integration Hub to update secrets based on the provided configurations.

license: Apache-2.0

version: "3"

base: ubuntu@22.04

platforms:
  amd64:
  arm64:

run_user: _daemon_

environment:
  PYTHONPATH: /opt/spark/python:/opt/spark8t/python/dist:/usr/lib/python3.10/site-packages:/opt/hub
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}

services:
  integration-hub:
    command: "/bin/bash opt/hub/bin/monitor_sa.sh"
    summary: "This is the service to startup the process that monitor Spark8t's service accounts."
    override: replace
    startup: enabled
    on-success: restart
    on-failure: restart
    environment:
      SPARK_PROPERTIES_FILE: /etc/hub/conf/spark-defaults.conf
      SA_ALLOWLIST: /etc/hub/conf/allowlist
      TRUSTSTORE_PATH: /etc/hub/conf/truststore.jks
      TRUSTSTORE_SECRET_NAME: integrator-hub-conf-truststore

parts:
  spark8t:
    plugin: nil
    build-packages:
      - wget
      - ssl-cert
      - git
    overlay-packages:
      - python3-pip
    overlay-script: |
      mkdir -p $CRAFT_PART_INSTALL/opt/spark8t/python/dist
      # renovate: datasource=pypi
      pip install --target=${CRAFT_PART_INSTALL}/opt/spark8t/python/dist spark8t==1.5.0
      rm usr/bin/pip*
    stage:
      - opt/spark8t/python/dist

  hub-files:
    plugin: dump
    after: [spark8t]
    source: files
    organize:
      bin/monitor_sa.sh: opt/hub/bin/monitor_sa.sh
      spark/conf/spark-defaults.conf: etc/hub/conf/spark-defaults.conf
    stage:
      - opt/hub/bin/monitor_sa.sh
      - etc/hub/conf/spark-defaults.conf

  hub-app:
    plugin: dump
    after: [hub-files]
    source: app
    organize:
      "*": opt/hub/app/
    stage:
      - opt/hub/app

  user-setup:
    plugin: nil
    after: [hub-files]
    overlay-packages:
      - python3
      - openjdk-17-jre-headless

    override-prime: |
      # Please refer to https://discourse.ubuntu.com/t/unifying-user-identity-across-snaps-and-rocks/36469
      # for more information about shared user.
      HUB_GID=584792
      HUB_UID=584792

      craftctl default

      chown -R ${HUB_GID}:${HUB_UID} opt/
      chmod -R 750 opt/

      chown -R ${HUB_GID}:${HUB_UID} etc/
      chmod -R 750 etc/

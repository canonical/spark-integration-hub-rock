name: Trivy scan

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: |
          Prefix for rock package GitHub artifact(s)

          Use canonical/data-platform-workflows build_rock.yaml to build the rock(s)
        required: true
        type: string
      submit_dependency_graph:
        description: "Submit SBOM to GitHub Dependency Graph"
        required: false
        type: boolean
        default: false

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic

      - name: Download rock package(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Import image locally
        run: |
          rockcraft.skopeo --insecure-policy copy \
            oci-archive:$(find . -type f -name "*${{matrix.arch}}.rock") \
            docker-daemon:trivy/spark-integration-hub-${{ matrix.arch }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        # v0.36.0
        with:
          image-ref: "trivy/spark-integration-hub-${{ matrix.arch }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: ${{ matrix.arch }}

      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        # v0.36.0
        if: ${{ inputs.submit_dependency_graph }}
        with:
          scan-type: "image"
          format: "github"
          output: "dependency-results-${{ matrix.arch }}.sbom.json"
          image-ref: "trivy/spark-integration-hub-${{ matrix.arch }}:${{ github.sha }}"
          github-pat: ${{ secrets.GITHUB_TOKEN }}

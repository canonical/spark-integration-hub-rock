name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tooling
        run: |
          pipx install tox
          pipx install yamllint

      - name: YAML Lint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 250}}}" \
            --no-warnings rockcraft.yaml

      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tox
        run: pipx install tox

      - name: Run tests
        run: tox run -e unit

  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@3e06c25ea6d5922a25a96d0c7b6a3c7522e65c9a # v54.0.0
    permissions:
      contents: read

  integration-test:
    name: Integration tests
    needs: [build]
    uses: ./.github/workflows/integration-test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      contents: read

  trivy:
    name: CVE Scanning
    needs: [build]
    uses: ./.github/workflows/trivy.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      contents: read
      security-events: write

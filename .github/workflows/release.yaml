name: Release to GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 3/edge

permissions:
  contents: read

jobs:
  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@3e06c25ea6d5922a25a96d0c7b6a3c7522e65c9a # v54.0.0

  release:
    name: Release rock
    needs:
      - build
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@3e06c25ea6d5922a25a96d0c7b6a3c7522e65c9a # v54.0.0
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    permissions:
      packages: write # Needed to publish to GitHub Container Registry
      contents: write # Needed to create git tags

  trivy:
    needs: build
    uses: ./.github/workflows/trivy.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      submit_dependency_graph: true
    permissions:
      contents: write # dependency graph
      security-events: write

providers:
  k8s:
    enable: true
    channel: 1.32-classic/stable
    features:
      local-storage:
      load-balancer:
        enabled: true
        l2-mode: true
        cidrs: 10.64.0.0/16
    bootstrap-constraints:
      root-disk: 4G
    
host:
  packages:
    - pipx
  snaps:
    kubectl:
      channel: latest/stable
    rockcraft:
      channel: latest/stable
    spark-client:
      channel: 3.5/edge